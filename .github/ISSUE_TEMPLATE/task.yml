name: Task
description: A concrete unit of development work, usually under a feature
title: "task: "
labels: [task]
body:
  - type: input
    id: parent
    attributes:
      label: Parent feature or issue
      description: Leave empty for standalone chores.
      placeholder: "#10"
  - type: textarea
    id: work
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it's done?
      placeholder: |
        - [ ] …
