name: Bug report
description: Something in the plugin or viewer doesn't work as documented
title: "bug: "
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Studio plugin / canvas editor
        - React viewer (/react)
        - Queries / types (/queries)
        - Example app
        - Build / packaging
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "plugin x.y.z, sanity x.y.z, next x.y.z, react x.y.z"
    validations:
      required: true
