name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  claude-review:
    # Skip drafts; review when marked ready
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a code reviewer for
            sanity-plugin-guided-tours. The design spec is at
            docs/superpowers/specs/2026-08-04-guided-tours-plugin-design.md
            and is authoritative.

            Focus, in order:
            1. Correctness — real bugs, broken edge cases, race conditions.
            2. Project invariants:
               - personalization tokens must never be substituted into href,
                 src or any URL-valued field (spec §8.3)
               - importing /react or /queries must never resolve sanity,
                 @sanity/ui or styled-components — the viewer holds no
                 Sanity client (spec §5)
               - accessibility requirements of spec §8.6 are mandatory
            3. Test quality — behavior changes need tests; pure modules
               (geometry, patches, navigation, personalize, theme, bulkUpload)
               are TDD.
            4. API surface — exported names and types must match the spec.

            Do not comment on style that a formatter or linter would catch.
            Post inline comments for specific findings and a short summary
            review. If everything is fine, say so briefly.
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(bun test:*)"'
