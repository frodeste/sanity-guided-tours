name: CI

on:
  pull_request:
  push:
    branches: [main]

# M9 QA hardening (issues #134/#136/#138): the actual gate sequence
# (lint/typecheck/build/test-with-coverage/attw/verify/examples) now lives
# in the shared `gates.yml` reusable workflow so `release.yml` can call the
# exact same checks before a publish rather than drifting from what PRs are
# gated on — see `.superpowers/sdd/qa-research.md` §6. GitHub renders a
# called-workflow's job as `<this job id> / <called job's name>`, so this
# job's id (`gates`) is part of the resulting required-status-check context;
# see `gates.yml`'s own comment for the exact string.
jobs:
  gates:
    uses: ./.github/workflows/gates.yml
  # M9 QA hardening (issue #135): dead-code/circular-dependency/duplication
  # checks. Parallel to `gates` (not `needs:`) — none of the three tools
  # read `dist/`, so there's no build-order dependency, and running them
  # concurrently keeps this job off the PR's critical path. Job id is
  # `quality` deliberately (not e.g. `code-health`): the controller's
  # required-status-checks ruleset update (qa-research.md §5) pins on this
  # exact context once findings are triaged clean, so the id/name must stay
  # `quality` verbatim — see `docs/superpowers/plans/2026-08-06-m9-qa-hardening.md`.
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Dead exports/files/dependencies — gating. `knip.jsonc` carries the
      # entry points and targeted ignores (each with an inline comment for
      # why); a clean run here means no NEW dead surface has crept in since
      # this job's config was last triaged (qa-research.md §4).
      - run: bunx knip --reporter compact
      # Circular imports — gating, near-zero false-positive risk for a
      # plugin package this size (qa-research.md §4).
      - run: bunx madge --circular --extensions ts,tsx src
      # Duplication — informational only (qa-research.md §4: "needs one
      # real run to calibrate before it can safely block merges"; the M9
      # Task 2 baseline is ~2.05% duplicated lines across `src/`, recorded
      # in the task report, not enforced here). `.jscpd.json` writes a
      # markdown report to `.jscpd/`; `|| true` is scoped to ONLY this
      # step, matching the plan's Global Constraints — `knip`/`madge`
      # above stay fully gating. The summary append runs unconditionally
      # (not gated on jscpd's own exit code) so a report still shows up
      # even if jscpd itself errors out for an unrelated reason.
      - name: Duplication (jscpd, informational)
        run: bunx jscpd || true
      - name: Append duplication report to job summary
        if: always()
        run: |
          if [ -f .jscpd/jscpd-report.md ]; then
            cat .jscpd/jscpd-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Duplication (`jscpd`)' >> "$GITHUB_STEP_SUMMARY"
            echo 'jscpd produced no report.' >> "$GITHUB_STEP_SUMMARY"
          fi
