name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: lint · typecheck · build · test · verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      # Must run AFTER `bun run build` above, not before: three tests in
      # test/react/useClient.test.ts read the real dist/react|index|queries
      # output (the "use client" directive guard) and self-skip when dist/
      # doesn't exist yet — with the old lint/typecheck/test/build order,
      # those tests never actually ran in CI, only locally after a manual
      # `bun run build`. Moving the build step first makes CI exercise the
      # same guard a local `rm -rf dist && bun run build && bun test` does.
      - run: bun test
      - name: build example app
        # env vars intentionally unset — this is the no-env build guard
        # (examples/web must build without NEXT_PUBLIC_SANITY_* configured).
        # Must run after `bun run build` above: the example app resolves
        # sanity-plugin-guided-tours through dist/, not src/.
        run: cd examples/web && bun run build
      - run: bunx @sanity/plugin-kit verify-package
