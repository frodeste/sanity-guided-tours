name: CI

on:
  pull_request:
  push:
    branches: [main]

# M9 QA hardening (issues #134/#136/#138): the actual gate sequence
# (lint/typecheck/build/test-with-coverage/attw/verify/examples) now lives
# in the shared `gates.yml` reusable workflow so `release.yml` can call the
# exact same checks before a publish rather than drifting from what PRs are
# gated on — see `.superpowers/sdd/qa-research.md` §6. GitHub renders a
# called-workflow's job as `<this job id> / <called job's name>`, so this
# job's id (`gates`) is part of the resulting required-status-check context;
# see `gates.yml`'s own comment for the exact string.
jobs:
  gates:
    uses: ./.github/workflows/gates.yml
