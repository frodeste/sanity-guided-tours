name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      # PRs are squash-merged with the PR title as the commit message on main,
      # so the title is what semantic-release reads. Enforce it here.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            chore
            refactor
            test
            ci
            build
            style
            revert
